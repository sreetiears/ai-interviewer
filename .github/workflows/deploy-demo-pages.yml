# Deploy the static demo frontend to GitHub Pages (free).
# Cloudflare Pages remains the preferred China-facing host; connect the same
# repo in the Cloudflare dashboard with Root directory = frontend.
name: Deploy demo site

on:
  push:
    branches: [ai_made, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
