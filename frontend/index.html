<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研复试模拟系统 - AI 智能考官</title>
  <!-- LiveKit Client SDK from CDN (Official Free Open-Source JS SDK) -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.11.0/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .brand-title p {
      font-size: 0.825rem;
      color: var(--text-sub);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.3s;
    }

    .status-dot.connected {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-dot.speaking {
      background: #3b82f6;
      box-shadow: 0 0 10px #3b82f6;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.6; }
      to { transform: scale(1.3); opacity: 1; }
    }

    .main-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 32px;
    }

    @media (max-width: 768px) {
      .main-stage {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      position: relative;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      border: 2px solid var(--card-border);
    }

    .ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.3s, transform 0.3s;
    }

    .ring.active {
      border-color: var(--accent);
      animation: ripple 1.5s infinite;
    }

    @keyframes ripple {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 0.825rem;
      color: var(--text-sub);
    }

    /* Process Flow Indicator */
    .flow-indicator {
      grid-column: 1 / -1;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .flow-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .flow-step.active {
      color: var(--primary);
      font-weight: 600;
    }

    .step-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .flow-step.active .step-number {
      background: var(--primary);
    }

    /* Controls */
    .controls {
      padding: 24px 32px;
      background: #1e293b;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Transcript Box */
    .transcript-box {
      margin: 0 32px 32px 32px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.875rem;
    }

    .transcript-line {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .transcript-role {
      font-weight: 600;
      margin-right: 6px;
    }
    .role-interviewer { color: #60a5fa; }
    .role-candidate { color: #34d399; }
    .role-sys { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div class="brand-title">
          <h1>考研复试 AI 模拟面试系统</h1>
          <p>基于 LangGraph 状态机 · 沉浸式语音双向交互</p>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <div class="main-stage">
      <!-- AI Interviewer Card -->
      <div class="card">
        <div class="avatar-wrap">
          <div class="ring" id="aiRing"></div>
          <div class="avatar">👨‍🏫</div>
        </div>
        <div class="card-title">主考官 (AI)</div>
        <div class="card-sub" id="aiState">等待接入</div>
      </div>

      <!-- Candidate Card -->
      <div class="card">
        <div class="avatar-wrap">
          <div class="ring" id="userRing"></div>
          <div class="avatar">🧑‍🎓</div>
        </div>
        <div class="card-title">考生 (您)</div>
        <div class="card-sub" id="micState">麦克风已就绪</div>
      </div>

      <!-- Interview Stage Stepper -->
      <div class="flow-indicator">
        <div class="flow-step active" id="step1">
          <div class="step-number">1</div>
          <span>自我介绍</span>
        </div>
        <div>→</div>
        <div class="flow-step" id="step2">
          <div class="step-number">2</div>
          <span>专业问答</span>
        </div>
        <div>→</div>
        <div class="flow-step" id="step3">
          <div class="step-number">3</div>
          <span>综合素质</span>
        </div>
        <div>→</div>
        <div class="flow-step" id="step4">
          <div class="step-number">4</div>
          <span>综合成绩单</span>
        </div>
      </div>
    </div>

    <!-- Transcript / Event Logs -->
    <div class="transcript-box" id="transcriptBox">
      <div class="transcript-line"><span class="transcript-role role-sys">[系统提示]</span> 点击“进入考场”开始模拟面试，系统将自动申请麦克风权限。</div>
    </div>

    <!-- Control Bar -->
    <div class="controls">
      <button class="btn btn-primary" id="btnConnect">
        <span>🎙️ 进入考场</span>
      </button>
      <button class="btn btn-danger" id="btnDisconnect" disabled>
        <span>🚪 退出面试</span>
      </button>
    </div>
  </div>

  <script>
    let currentRoom = null;
    const btnConnect = document.getElementById("btnConnect");
    const btnDisconnect = document.getElementById("btnDisconnect");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const transcriptBox = document.getElementById("transcriptBox");
    const aiRing = document.getElementById("aiRing");
    const userRing = document.getElementById("userRing");
    const aiState = document.getElementById("aiState");

    function log(role, text) {
      const line = document.createElement("div");
      line.className = "transcript-line";
      let roleClass = "role-sys";
      if (role === "考官") roleClass = "role-interviewer";
      if (role === "考生") roleClass = "role-candidate";

      line.innerHTML = `<span class="transcript-role ${roleClass}">[${role}]</span> ${text}`;
      transcriptBox.appendChild(line);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    async function startInterview() {
      btnConnect.disabled = true;
      statusText.innerText = "正在获取入场凭证...";

      try {
        // 1. Fetch token from our backend server (No manual API secret required!)
        const res = await fetch("/api/token?room=ai-room");
        if (!res.ok) throw new Error("获取 Token 失败");
        const connData = await res.json();

        statusText.innerText = "正在连接考场...";

        // 2. Connect to LiveKit Room using open-source LiveKit JS SDK
        const room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
        });
        currentRoom = room;

        // Setup audio playback for the AI agent
        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
          if (track.kind === LivekitClient.Track.Kind.Audio) {
            const audioElement = track.attach();
            document.body.appendChild(audioElement);
            log("系统", "已接通考官音频通道");
          }
        });

        // Speaking indicators
        room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
          let aiSpeaking = false;
          let userSpeaking = false;

          for (const speaker of speakers) {
            if (speaker.isLocal) {
              userSpeaking = true;
            } else {
              aiSpeaking = true;
            }
          }

          if (aiSpeaking) {
            aiRing.classList.add("active");
            aiState.innerText = "正在发问...";
          } else {
            aiRing.classList.remove("active");
            aiState.innerText = "倾听作答中";
          }

          if (userSpeaking) {
            userRing.classList.add("active");
          } else {
            userRing.classList.remove("active");
          }
        });

        room.on(LivekitClient.RoomEvent.Disconnected, () => {
          statusDot.className = "status-dot";
          statusText.innerText = "已断开连接";
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
          aiRing.classList.remove("active");
          userRing.classList.remove("active");
          aiState.innerText = "离线";
          log("系统", "面试已结束并退出考场。");
        });

        // Connect room
        await room.connect(connData.serverUrl, connData.token);
        log("系统", "成功进入面试房间：" + connData.roomName);

        // Publish local microphone
        await room.localParticipant.setMicrophoneEnabled(true);
        log("系统", "已启用麦克风，准备进行语音交互。");

        statusDot.className = "status-dot connected";
        statusText.innerText = "面试进行中";
        btnDisconnect.disabled = false;

      } catch (err) {
        console.error(err);
        alert("连接考场失败: " + err.message);
        statusDot.className = "status-dot";
        statusText.innerText = "连接失败";
        btnConnect.disabled = false;
      }
    }

    function stopInterview() {
      if (currentRoom) {
        currentRoom.disconnect();
        currentRoom = null;
      }
    }

    btnConnect.addEventListener("click", startInterview);
    btnDisconnect.addEventListener("click", stopInterview);
  </script>
</body>
</html>
